[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terralogic-bot"
version = "0.1.0"
description = "Telegram delivery interface for TerraLogicX quick reports"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TerraLogicX" }
]
dependencies = [
    "aiogram>=3.10",
    "mcp>=1.27,<2",
    "pydantic>=2.10",
]

[project.scripts]
terralogic-bot = "terralogic_bot.main:main"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]
lint = [
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terralogic_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
