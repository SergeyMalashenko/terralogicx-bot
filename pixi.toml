[workspace]
channels = ["conda-forge"]
name = "terralogic-bot"
platforms = ["linux-aarch64", "linux-64"]
version = "0.1.0"

[tasks]
# Запуск бота (после `pixi install`); .env подхватывается автоматически
start = "terralogic-bot"
# Юнит-тесты без живого backend/Telegram
test = "python -m pytest tests/ -q"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
terralogic-bot = { path = ".", editable = true }
aiogram = ">=3.31.0, <4"
mcp = ">=1.27, <2"
pydantic = ">=2.10"
python-dotenv = ">=1.2.4, <2"
pytest = ">=8.3"
pytest-asyncio = ">=0.25"
